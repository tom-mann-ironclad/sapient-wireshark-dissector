name: Release

# On a version tag (vX.Y.Z): runs CI, then publishes the plugin and the
# SAPIENT schema as one archive, with its SHA-256 and signed build
# provenance (SLSA, via actions/attest). Consumers can then verify exactly
# what they install, e.g. the SAPIENT Helpdesk's harness image:
#
#   gh attestation verify sapient-wireshark-dissector-vX.Y.Z.tar.gz \
#       --repo tom-mann-ironclad/sapient-wireshark-dissector \
#       --signer-workflow tom-mann-ironclad/sapient-wireshark-dissector/.github/workflows/release.yml \
#       --source-ref refs/tags/vX.Y.Z
#
# Creates the GitHub release if the tag doesn't have one yet.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload its files
      attestations: write
      id-token: write # sign the provenance (Sigstore, via GitHub's OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What a consumer installs: the plugin, the schema it decodes with,
      # and the licences. Not tests or scripts.
      - name: Build the archive and its checksum
        run: |
          name="sapient-wireshark-dissector-${GITHUB_REF_NAME}"
          git archive --format=tar --prefix="$name/" HEAD \
              plugins proto LICENSE-APACHE LICENSE-MIT README.md \
              | gzip -n > "$name.tar.gz"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Sign its build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
              || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag
          gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
