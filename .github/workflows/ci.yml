name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  lint:
    name: Lua syntax check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install lua5.3 (for luac)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.3

      - name: Check plugins/sapient.lua syntax
        run: luac5.3 -p plugins/sapient.lua

  decode-smoke-test:
    name: Real decode smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Confirmed on a real Ubuntu 24.04 image (not assumed): apt's tshark
      # ships with Lua 5.2.4 built in, unlike RHEL/Rocky/CentOS's distro
      # package (see the main README and scripts/build-wireshark-with-lua.sh)
      # -- DEBIAN_FRONTEND avoids the interactive "allow non-root packet
      # capture" prompt, which doesn't matter here since this job never
      # captures live traffic, only reads a synthetic .pcap from disk.
      - name: Install tshark
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tshark bsdextrautils

      - name: Verify Lua support actually present
        run: tshark -v | tr '\n' ' ' | grep -q '+Lua\|with Lua' && echo "Lua support confirmed"

      - name: Run the real end-to-end decode test
        run: tests/decode_smoke_test.sh
